# 临时探针：确认 GitHub 托管的 macOS runner 能否分到机器，以及镜像里有哪些 Xcode。
# 只为选 runner 用，跑完即可删除。
name: runner probe
on:
  workflow_dispatch:
jobs:
  probe-15:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: What is this machine
        run: |
          uname -a
          xcodebuild -version
          ls /Applications | grep -i xcode || true
  probe-26:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: What is this machine
        run: |
          uname -a
          xcodebuild -version
          ls /Applications | grep -i xcode || true